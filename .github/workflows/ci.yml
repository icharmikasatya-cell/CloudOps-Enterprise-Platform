
name: CloudOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test health endpoint
        run: |
          python -c "from app import app; c = app.test_client(); r = c.get('/health'); assert r.status_code == 200; assert r.get_json()['status'] == 'healthy'; print('Health test passed')"

      - name: Build Docker image
        run: docker build -t cloudops-web .

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy to EC2 through Systems Manager
        shell: bash
        env:
          INSTANCE_ID: i-041a75f32b64057c8
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euo pipefail

          REPO=/opt/CloudOps-Enterprise-Platform
          URL=https://github.com/icharmikasatya-cell/CloudOps-Enterprise-Platform.git

          if [ ! -d "$REPO/.git" ]; then
            git clone "$URL" "$REPO"
          fi

          git -C "$REPO" fetch origin main
          git -C "$REPO" reset --hard origin/main

          cd "$REPO"
          docker build -t cloudops-web:latest .

          docker rm -f cloudops-web-container || true

          docker run -d \
            --name cloudops-web-container \
            --restart unless-stopped \
            -p 127.0.0.1:5000:5000 \
            cloudops-web:latest

          for i in $(seq 1 12); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed"
          docker logs cloudops-web-container
          exit 1
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg cmd "$DEPLOY_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --comment "Deploy CloudOps from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment"
          exit 1
